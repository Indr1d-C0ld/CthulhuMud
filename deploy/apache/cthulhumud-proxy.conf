# Espone il sito di CthulhuMud sotto https://timrouter.dns.army/cthulhumud/
#
# Da includere DENTRO il <VirtualHost *:443> esistente
# (/etc/apache2/sites-enabled/000-default-le-ssl.conf): vedi
# deploy/apache/install.sh, che lo fa in automatico.
#
# Perche' esiste: la porta 4001 su cui Evennia serve il proprio sito e'
# una porta anomala, scartata in silenzio da molte reti (aziendali,
# mobili, hotspot) - il sintomo e' una lunga attesa seguita da timeout.
# La 443 invece e' gia' raggiungibile dall'esterno ed e' in dual-stack,
# quindi questo proxy risolve insieme sia il blocco della porta sia
# l'assenza di IPv6 lato Evennia (vedi la nota in server/conf/settings.py).

# --- websocket del client di gioco (deve precedere la regola generale) ---
# Richiede il modulo proxy_wstunnel (abilitato da install.sh).
ProxyPass        /cthulhumud/ws  ws://127.0.0.1:4002/
ProxyPassReverse /cthulhumud/ws  ws://127.0.0.1:4002/

# --- sito web di Evennia ---
ProxyPass        /cthulhumud/  http://127.0.0.1:4001/
ProxyPassReverse /cthulhumud/  http://127.0.0.1:4001/

# Senza barra finale, perche' /cthulhumud funzioni come /cthulhumud/
RedirectMatch ^/cthulhumud$ /cthulhumud/

<Location /cthulhumud/>
    # Evennia genera gli URL con il prefisso /cthulhumud (FORCE_SCRIPT_NAME);
    # e' Apache a toglierlo prima di inoltrare, quindi le due cose combaciano.
    ProxyPreserveHost On
    # Indispensabile: dice a Django che il browser sta parlando in HTTPS
    # anche se il collegamento interno verso Evennia e' in chiaro. Senza,
    # Django genera link "http://" dentro una pagina servita in HTTPS e il
    # browser li blocca come contenuto misto.
    RequestHeader set X-Forwarded-Proto "https"
    Require all granted
</Location>
